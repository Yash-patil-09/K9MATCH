{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5 text-center my-auto" style="min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <div class="bg-white p-5 rounded-4 shadow-sm border" style="max-width: 550px;" data-aos="zoom-in">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <div class="mb-3">
            <i class="fas fa-paw fa-3x text-warning"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Lost in the Dog Park?</h3>
        <p class="text-muted mb-4">
            We couldn't sniff out the page you were looking for. It might have been moved or doesn't exist.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 fw-bold">
                <i class="fas fa-home me-1"></i> Back to Home
            </a>
            <a href="{% url 'explore_dogs' %}" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
                <i class="fas fa-search me-1"></i> Find Matches
            </a>
        </div>
    </div>
</div>
{% endblock %}
