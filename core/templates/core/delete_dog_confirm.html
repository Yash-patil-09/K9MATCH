{% extends 'core/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-3 text-center p-4">
                <div class="text-danger mb-3">
                    <i class="fas fa-exclamation-triangle fa-4x"></i>
                </div>
                <h3 class="fw-bold mb-2">Delete {{ dog.name }}?</h3>
                <p class="text-muted small mb-4">
                    Are you sure you want to delete <strong>{{ dog.name }}</strong>'s profile? This action cannot be undone and all uploaded photos will be permanently removed.
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'dog_detail' dog.id %}" class="btn btn-light fw-bold px-4 me-md-2">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger fw-bold px-4">
                            Yes, Delete Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
