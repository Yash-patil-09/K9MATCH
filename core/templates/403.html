{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5 text-center my-auto" style="min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <div class="bg-white p-5 rounded-4 shadow-sm border" style="max-width: 550px;" data-aos="zoom-in">
        <div class="display-1 fw-bold text-danger mb-2">403</div>
        <div class="mb-3">
            <i class="fas fa-shield-dog fa-3x text-danger"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Access Restricted</h3>
        <p class="text-muted mb-4">
            You don't have permission to access this area or profile. Only verified dog owners or admins can view this content.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 fw-bold">
                <i class="fas fa-home me-1"></i> Back to Home
            </a>
            <a href="{% url 'my_dogs' %}" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
                <i class="fas fa-dog me-1"></i> My Dogs
            </a>
        </div>
    </div>
</div>
{% endblock %}
